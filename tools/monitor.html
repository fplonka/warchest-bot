<!doctype html><meta charset=utf-8><title>warchest runs</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<link rel=icon href="data:,">
<link rel=stylesheet href=/vendor/uPlot.min.css>
<style>
:root{--bg:#fff;--ink:#111;--mut:#666;--line:#ddd;--live:#178a66}
@media (prefers-color-scheme:dark){:root{--bg:#111;--ink:#e8e8e8;--mut:#999;--line:#333;--live:#3cc596}}
*{box-sizing:border-box}
body{margin:0;display:flex;height:100vh;background:var(--bg);color:var(--ink);
 font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 font-variant-numeric:tabular-nums}
aside{width:270px;flex:none;overflow-y:auto;border-right:1px solid var(--line);padding:0 8px 8px}
#filter{position:sticky;top:0;width:100%;margin-bottom:6px;padding:9px 6px;border:0;
 border-bottom:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;outline:0}
main{flex:1;overflow-y:auto;padding:14px 16px 40px}
button{display:block;width:100%;text-align:left;background:none;color:var(--ink);
 border:0;border-radius:3px;padding:4px 6px;margin-bottom:1px;font:inherit;cursor:pointer}
button:hover{background:var(--line)}
button.on{background:var(--line);font-weight:700}
.top{display:flex;justify-content:space-between;gap:8px}
.sub,.age{color:var(--mut);font-size:11px;font-weight:400}
.sub{display:block}
.live{color:var(--live);font-size:11px}
h1{font-size:14px;margin:0 0 2px}
h1 span+span{margin-left:8px}
h2{font-size:12px;margin:22px 0 6px;color:var(--mut)}
.meta{color:var(--mut);margin:0 0 6px}
.note,#changed{margin:0 0 8px}
details{color:var(--mut);margin:0 0 12px}
summary{cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:10px 18px}
.panel{min-width:0}
.uplot{font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.u-title{font-size:11px;text-align:left;font-weight:700}
.panel .u-legend{font-size:10px;margin:0}
.u-legend .raw{display:none}
.u-legend th,.u-legend td{padding:0 8px 0 0;border:0}
.u-select{background:#8883}
pre{max-height:340px;overflow:auto;margin:4px 0;font:inherit;white-space:pre-wrap}
#loglink{margin-left:8px;font-size:11px;color:#3d8bfd}
@media (max-width:600px){
 body{display:block;height:100dvh;overflow:hidden}
 aside{width:100%;height:58px;overflow-x:auto;overflow-y:hidden;border:0;border-bottom:1px solid var(--line);padding:0}
 #filter{display:none}
 #list{display:flex}
 aside button{width:auto;min-width:170px;flex:none;white-space:nowrap}
 main{height:calc(100dvh - 58px);padding:10px;overflow-y:auto}
 .grid{grid-template-columns:minmax(0,1fr)}
}
</style>
<aside><input id=filter type=search placeholder="filter runs" autocomplete=off><div id=list></div></aside>
<main>
 <h1><span id=title></span><span id=status></span><a id=loglink target=_blank>train.log</a></h1>
 <p class=meta id=meta></p><p class=note id=note></p>
 <p id=changed></p>
 <details><summary>config</summary><p id=cfg></p></details>
 <p class=meta><label><input type=checkbox id=logx> log time</label> · drag zoom · wheel zoom · middle-drag pan · double-click reset · legends show the latest value</p>
 <div class=grid id=panels></div>
 <h2 id=laddertitle>checkpoint ladder</h2><pre id=ladder></pre>
 <h2 id=comparisonstitle>comparisons</h2><pre id=comparisons></pre>
 <div id=text></div>
</main>
<script src=/vendor/uPlot.iife.min.js></script>
<script>
const COLORS = ["#4e79a7", "#e15759", "#59a14f", "#f28e2b", "#76b7b2",
  "#edc949", "#af7aa1", "#ff9da7", "#9c755f", "#bab0ac", "#8cd17d"];
const $ = id => document.getElementById(id);
const E = (tag, cls, text) => { const n = document.createElement(tag);
  if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
let sel = decodeURIComponent(location.hash.slice(1)) || null;
let logx = true;
try { logx = localStorage.logx !== "0"; } catch (e) {}
const fwd = v => logx ? Math.log2(v) : v, back = v => logx ? 2 ** v : v;
let runs = [], stages = [], shape = "", plots = [], view = null, full = [0, 1];

const api = async u => { try { const r = await fetch(u); return r.ok ? r.json() : null; }
                         catch (e) { return null; } };
const fmt = v => v == null ? "—" : Math.abs(v) >= 1e5 || (v && Math.abs(v) < 1e-3)
  ? v.toExponential(2) : String(+v.toPrecision(4));
const dur = h => h < 1 ? Math.round(h * 60) + "m" : h < 48 ? +h.toFixed(1) + "h" : +(h / 24).toFixed(1) + "d";
const age = r => r.running ? "● live" : dur((Date.now() / 1000 - r.mtime) / 3600) + " ago";
const trained = r => r.budget ? `${dur(r.hours)} of ${dur(r.budget)}` : dur(r.hours);
const latest = y => { let i = y.length - 1; while (i > 0 && y[i] == null) i--; return i; };

function zoom(range) {
  view = range && [Math.max(range[0], full[0]), Math.min(range[1], full[1])];
  const [min, max] = view || full;
  plots.forEach(q => q.u.setScale("x", {min, max}));
}

function navigation() {
  return {hooks: {
    setSelect: u => {
      if (!u.select.width) return;
      zoom([u.posToVal(u.select.left, "x"), u.posToVal(u.select.left + u.select.width, "x")]);
      u.setSelect({width: 0, height: 0}, false);
    },
    ready: u => {
      const over = u.over, logs = r => r.map(fwd), shift = (lo, span) => {
        const [a, b] = logs(full); lo = Math.min(Math.max(lo, a), b - span); zoom([back(lo), back(lo + span)]); };
      over.addEventListener("wheel", e => {
        e.preventDefault();
        const [min, max] = logs(view || full), [a, b] = logs(full), x = fwd(u.posToVal(u.cursor.left, "x"));
        const span = Math.min(b - a, (max - min) * (e.deltaY < 0 ? .75 : 1 / .75));
        shift(x - (x - min) / (max - min) * span, span);
      }, {passive: false});
      over.addEventListener("mousedown", e => {
        if (e.button !== 1) return;
        e.preventDefault();
        const start = e.clientX, [min, max] = logs(view || full), per = (max - min) / over.clientWidth;
        const move = ev => shift(min - per * (ev.clientX - start), max - min);
        const up = () => { removeEventListener("mousemove", move); removeEventListener("mouseup", up); };
        addEventListener("mousemove", move); addEventListener("mouseup", up);
      });
    }}};
}

function overlays(state) {
  return {hooks: {draw: u => {
    const {ctx, bbox} = u, dpr = devicePixelRatio || 1, p = state.p;
    ctx.save(); ctx.beginPath(); ctx.rect(bbox.left, bbox.top, bbox.width, bbox.height); ctx.clip();
    ctx.lineWidth = dpr;
    p.s.forEach((s, i) => s.e && s.y.forEach((v, k) => {
      if (v == null) return;
      const x = u.valToPos(p.x[k], "x", true);
      ctx.strokeStyle = COLORS[i % COLORS.length];
      ctx.beginPath(); ctx.moveTo(x, u.valToPos(v - s.e[k], "y", true));
      ctx.lineTo(x, u.valToPos(v + s.e[k], "y", true)); ctx.stroke();
    }));
    ctx.strokeStyle = ctx.fillStyle = "#888"; ctx.font = 10 * dpr + "px ui-monospace,monospace";
    ctx.setLineDash([2 * dpr, 3 * dpr]);
    stages.slice(1).forEach(([name, h], i) => {
      const x = u.valToPos(h, "x", true);
      ctx.beginPath(); ctx.moveTo(x, bbox.top); ctx.lineTo(x, bbox.top + bbox.height); ctx.stroke();
      ctx.fillText(name, x + 3 * dpr, bbox.top + 11 * (i + 1) * dpr);
    });
    ctx.restore();
  }}};
}

function plotData(p) {
  return [p.x, ...p.s.flatMap(s => s.m ? [s.y, s.m] : [s.y]),
    ...p.h.map(h => p.x.map(() => h[1]))];
}

function axes() {
  const dark = matchMedia("(prefers-color-scheme:dark)").matches;
  const stroke = dark ? "#999" : "#666", grid = dark ? "#333" : "#ddd";
  const doublings = (u, i, min, max) => {
    const lo = Math.ceil(Math.log2(min)), hi = Math.floor(Math.log2(max)), step = Math.ceil((hi - lo + 1) / 7);
    const ticks = [];
    for (let e = lo; e <= hi; e++) if (e % step === 0) ticks.push(2 ** e);
    return ticks;
  };
  return [{stroke, grid: {stroke: grid}, values: (u, ticks) => ticks.map(v => v == null ? "" : dur(v)),
     ...(logx && {splits: doublings})},
    {stroke, grid: {stroke: grid}, size: 65, values: (u, ticks) => ticks.map(fmt)}];
}

function makePlot(box, p) {
  const state = {p};
  const series = [{label: "training time",
    value: (u, v, si, idx) => fmt(state.p.x[idx ?? state.p.x.length - 1]) + " h"}];
  p.s.forEach((s, i) => {
    const stroke = COLORS[i % COLORS.length];
    if (s.m) series.push({label: s.n, class: "raw", stroke, width: 1,
      alpha: .22, auto: false, points: {show: false}, spanGaps: false});
    series.push({label: s.n, stroke, width: 1.5, spanGaps: s.dots,
      points: {show: s.dots, size: 5, fill: stroke},
      value: (u, v, si, idx) => {
        const t = state.p.s[i], k = idx ?? latest(t.y);
        return fmt(t.y[k]) + (t.e && t.y[k] != null ? " ± " + fmt(t.e[k]) : "");
      }});
  });
  p.h.forEach((h, i) => series.push({label: h[0], stroke: COLORS[(p.s.length + i) % COLORS.length],
    width: 1, dash: [5, 5], points: {show: false}, value: () => fmt(state.p.h[i][1])}));
  const opts = {title: p.t + " · " + p.y, width: box.clientWidth, height: 230,
    plugins: [navigation(), overlays(state)], scales: {x: {time: false, distr: logx ? 3 : 1, log: 2, range: (u, min, max) => [min, max]}, y: {}},
    cursor: {drag: {x: true, y: false, setScale: false}, bind: {dblclick: () => () => zoom(null)},
      sync: {key: "x", filters: {pub: type => type === "mousemove"}}}, series, axes: axes()};
  if (p.zero) opts.scales.y.range = (u, min, max) => {
    const lo = Math.min(0, min), hi = Math.max(0, max);
    return lo === hi ? [0, 1] : [lo, hi];
  };
  const u = new uPlot(opts, plotData(p), box);
  return {u, box, state};
}

function setText(el, s) {
  if (el.textContent === s) return;
  const at = el.scrollTop, bottom = at + el.clientHeight >= el.scrollHeight - 4;
  el.textContent = s;
  el.scrollTop = bottom ? el.scrollHeight : at;
}

function render(d) {
  const r = runs.find(r => r.name === d.name);
  document.title = d.name + " · warchest runs";
  $("title").textContent = d.name;
  $("status").textContent = r ? age(r) : "";
  $("status").className = r && r.running ? "live" : "age";
  $("meta").textContent = [d.stages.map(([n, h]) => h ? `${n} at ${dur(h)}` : n).join(" → "),
    r && trained(r) + " trained", d.git && "git " + d.git].filter(Boolean).join(" · ");
  $("note").textContent = d.note || "";
  const log = $("loglink");
  log.href = "/runs/" + encodeURIComponent(d.name) + "/train.log";
  log.style.display = d.log ? "" : "none";
  const changed = d.cfg.filter(c => c[2]).map(([k, v]) => k + "=" + v).join("  ");
  $("changed").textContent = changed && `changed from ${d.stages.at(-2)[0]}: ${changed}`;
  $("cfg").textContent = d.cfg.map(([k, v]) => k + "=" + v).join("  ");

  const grid = $("panels"), key = d.panels.map(p =>
    p.t + ":" + p.s.map(s => s.n).join(",") + ":" + p.h.map(h => h[0]).join(",")).join("|");
  stages = d.stages;
  const end = Math.max(...d.panels.map(p => p.x.at(-1)));
  full = [Math.max(Math.min(...d.panels.map(p => p.x[0])), logx ? end / 64 : 0), end];
  if (key !== shape) {
    plots.forEach(q => q.u.destroy());
    grid.textContent = "";
    const boxes = d.panels.map(() => grid.appendChild(E("div", "panel")));
    plots = d.panels.map((p, i) => makePlot(boxes[i], p));
    shape = key;
  } else {
    d.panels.forEach((p, i) => {
      plots[i].state.p = p;
      plots[i].u.setData(plotData(p), false);
    });
  }
  zoom(view);

  const reportText = report => report ? report.pairs.map(p =>
    `${p.a} (${p.a_minutes}m) vs ${p.b} (${p.b_minutes}m)  ` +
    `Elo ${p.elo >= 0 ? "+" : ""}${p.elo.toFixed(0)} ` +
    `[${p.elo_low.toFixed(0)}, ${p.elo_high.toFixed(0)}]  ` +
    `W${p.wins} L${p.losses} D${p.draws} · ${p.games} games`).join("\n") : "";
  [["ladder", reportText(d.ladder)],
   ["comparisons", d.comparisons.map(reportText).join("\n")]].forEach(([id, text]) => {
    $(id + "title").style.display = $(id).style.display = text ? "" : "none";
    setText($(id), text);
  });

  const text = $("text");
  if (!text.firstChild) ["notes", "train.log"].forEach(h => {
    text.appendChild(E("h2", null, h)); text.appendChild(E("pre")); });
  [d.notes || "", (d.log || "").split("\n").slice(-300).join("\n")].forEach((s, i) => {
    const head = text.children[2 * i], pre = text.children[2 * i + 1];
    head.style.display = pre.style.display = s ? "" : "none";
    setText(pre, s); });
}

function entry(r) {
  const b = E("button", r.name === sel ? "on" : null), top = E("span", "top");
  top.append(E("span", null, r.name), E("span", r.running ? "live" : "age", age(r)));
  b.append(top, E("span", "sub",
    [trained(r), r.parent && "from " + r.parent, r.note].filter(Boolean).join(" · ")));
  b.onclick = () => { location.hash = encodeURIComponent(r.name); };
  return b;
}

function list() {
  const a = $("list"), q = $("filter").value.toLowerCase(), at = a.parentNode.scrollTop;
  a.replaceChildren(...runs.filter(r =>
    [r.name, r.note, r.parent].join(" ").toLowerCase().includes(q)).map(entry));
  a.parentNode.scrollTop = at;
}

async function poll() {
  const got = await api("/api/runs");
  if (got) {
    runs = got;
    if (!sel && runs.length) sel = runs[0].name;
    list();
  }
  if (!sel) return;
  const d = await api("/api/run/" + encodeURIComponent(sel));
  if (d && d.name === sel) render(d);
}

$("filter").oninput = list;
$("logx").checked = logx;
$("logx").onchange = e => {
  logx = e.target.checked;
  try { localStorage.logx = logx ? "1" : "0"; } catch (err) {}
  shape = ""; view = null; poll();
};
addEventListener("resize", () =>
  plots.forEach(p => p.u.setSize({width: p.box.clientWidth, height: 230})));
addEventListener("hashchange", () => {
  sel = decodeURIComponent(location.hash.slice(1)) || sel; shape = ""; view = null; poll(); });
setInterval(poll, 10000);
poll();
</script>
